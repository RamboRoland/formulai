# Local hosting: S3, the game server and the App in containers.
#   docker compose up --build    → App http://localhost:3010, server ws://localhost:8090
# The server's data (tracks, sessions, backgrounds) lives in the local S3;
# fill it from the DigitalOcean Space: `docker compose up -d s3`, then `npm run fetch`
# in server/.
services:
  # Local S3 (SeaweedFS): the server's storage. Keys: seaweedfs/s3.json.
  # Data in the s3-data volume (kept by `down`, deleted by `down -v`).
  # Volumes capped at 64 MB: SeaweedFS reserves the full volume size on
  # disk for every volume (default 30 GB → ~1 GB each here), several per
  # bucket — that filled Docker's disk.
  s3:
    image: chrislusf/seaweedfs:4.09
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64
    ports:
      - "9100:8333"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
#  seed:
#    build: server
#    command: ["node", "scripts/seed.js"]
#    environment:
#      S3_ENDPOINT: http://s3:8333
#    depends_on:
#      - s3
  server:
    build: server
    ports:
      - "8090:8080"
    environment:
      EDITOR_PASSWORD: 'pelle'   # the track editor's password (local only); empty = track editing off
      S3_ENDPOINT: http://s3:8333   # the s3 service (container network); keys = the defaults
    # S3 starts first; the server waits up to 60 s for it, and is started
    # again if it still stops (or crashes).
    depends_on:
      - s3
    restart: unless-stopped
  app:
    build:
      context: app
      args:
        VITE_WS_URL: ws://localhost:8090      # the browser connects here (your machine, not the container network)
    ports:
      - "3010:3000"
    depends_on:
      - server

volumes:
  s3-data:
