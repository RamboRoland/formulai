# Deploy to the server (one Droplet, deploy/docker-compose.yml) on every
# push to main: type-check → build both images → push them to the GitHub
# Container Registry → write the settings (deploy/settings.py) → copy them
# + the compose file to the server, pull, restart.
# Set up once (README "Hosting"; repository level):
#   Variables: DEPLOY_HOST (the server's IP), DEPLOY_USER (its SSH user),
#              APP_DOMAIN (baked into the App: wss://APP_DOMAIN/ws,
#              https://APP_DOMAIN for the API; Caddy's domain),
#              BASIC_AUTH_USER, S3_ENDPOINT, S3_REGION, S3_BUCKET,
#              LOG_INCIDENTS
#   Secrets:   DEPLOY_SSH_KEY (private key for DEPLOY_USER),
#              DEPLOY_KNOWN_HOSTS (ssh-keyscan of the server),
#              BASIC_AUTH_HASH, EDITOR_PASSWORD, S3_ACCESS_KEY_ID,
#              S3_SECRET_ACCESS_KEY
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Server type-check
        working-directory: server
        run: npm ci && npx tsc --noEmit
      - name: App type-check
        working-directory: app
        run: npm ci && npm run typecheck

  # Until the server is set up (variables empty) only the check runs.
  images:
    needs: check
    if: vars.APP_DOMAIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Registry names must be lower case (RamboRoland → ramboroland).
      - name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "SERVER_IMAGE=ghcr.io/$owner/formulai-server" >> "$GITHUB_ENV"
          echo "APP_IMAGE=ghcr.io/$owner/formulai-app" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ env.SERVER_IMAGE }}:latest,${{ env.SERVER_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          # The game server is under the App's domain (deploy/Caddyfile).
          build-args: |
            VITE_WS_URL=wss://${{ vars.APP_DOMAIN }}/ws
            VITE_API_URL=https://${{ vars.APP_DOMAIN }}
          tags: ${{ env.APP_IMAGE }}:latest,${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    needs: images
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # The server's .env + the filled Caddyfile from the secrets / variables
      # (deploy/settings.py; fails here if one is missing).
      - name: Settings
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
          LOG_INCIDENTS: ${{ vars.LOG_INCIDENTS }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          BASIC_AUTH_USER: ${{ vars.BASIC_AUTH_USER }}
          BASIC_AUTH_HASH: ${{ secrets.BASIC_AUTH_HASH }}
        run: python3 deploy/settings.py "$RUNNER_TEMP/settings"
      - name: Copy deploy files
        run: |
          ssh "$TARGET" 'mkdir -p ~/formulai/deploy ~/formulai/server'
          scp deploy/docker-compose.yml "$TARGET:formulai/deploy/"
          scp -p "$RUNNER_TEMP/settings/Caddyfile" "$TARGET:formulai/deploy/Caddyfile"
          scp -p "$RUNNER_TEMP/settings/server.env" "$TARGET:formulai/server/.env"
      # Pull with this run's token (over stdin; logged out again after),
      # restart what changed, reload Caddy (a changed Caddyfile; up to 5
      # tries — a just (re)created Caddy needs a moment), remove old
      # images. A failed pull / start / reload fails the step.
      - name: Pull and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | ssh "$TARGET" "cd ~/formulai/deploy \
            && docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && for i in 1 2 3 4 5; do sleep 2; \
                 docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile && break; done; \
            status=\$?; docker logout ghcr.io; docker image prune -f; exit \$status"
